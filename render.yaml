services:
  # ── Backend (Express API) ──────────────────────────────────────────────────
  - type: web
    name: skillwallet-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: JWT_EXPIRE
        value: 30d

  # ── Frontend (Vite React) ──────────────────────────────────────────────────
  - type: web
    name: skillwallet-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # Set to your backend Render URL after deploying backend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
